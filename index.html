<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="images/suisei_portrait.webp">
  <script src="client.js"></script>
  <title>Suisei Chat</title>
</head>
<body>
  <div class="bg"></div>
  <div class="suisei"></div>
  <div class="buttons">
    <button class="btn change-bg">Change Background</button>
    <button class="btn change-outfit">Change Outfit</button>
  </div>
  <div id="broke-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-icon">💸</div>
      <h2 class="modal-title">Suisei is Unavailable</h2>
      <p class="modal-body">Hoshimachi Suisei cannot respond right now because her operator has run out of OpenAI credits.<br><br>Please try again later, or tell them to get a job.</p>
      <button class="modal-close-btn" onclick="document.getElementById('broke-modal').style.display='none'">Close</button>
    </div>
  </div>

  <div class="chat">
    <div class="chat-container">
      <!-- chat messsages -->
    </div>
    <form>
      <textarea id="chat-input" rows="1" placeholder="Message Suisei" maxlength="200"></textarea>
      <button class="btn-send" type="button" onClick="sendMessage()">Send</button>
    </form>
  </div>
</body>
</html>
